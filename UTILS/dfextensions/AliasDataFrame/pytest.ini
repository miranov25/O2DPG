[pytest]
# Registers custom markers so pytest emits no PytestUnknownMarkWarning and -m marker
# selection is reliable. (BUG_20260630_run_tests.) Must live at the AliasDataFrame
# project root — pytest config discovery for `pytest tests/` does not look inside tests/.
markers =
    invariance: numerical/backend invariance tests (numpy vs arrow vs numba, draw vs materialize, roundtrip)
    volume_invariance: peak-RSS / memory-footprint gate (RSS-variance sensitive; see note below)
    memory: peak-RSS / memory-footprint gate (RSS-variance sensitive; see note below)
    integration: end-to-end / cross-module integration tests
    slow: long-running tests
    smoke: quick smoke checks

# Note: the runner uses a single parallel pytest invocation (the earlier two-lane
# parallel+serial design was dropped — it double-collected import-error files). The
# RSS-variance flakes on the volume_invariance/memory gates (peak_rss, parquet_roundtrip)
# are addressed at the test level (median-of-3 / relative threshold), tracked separately.

testpaths = tests
