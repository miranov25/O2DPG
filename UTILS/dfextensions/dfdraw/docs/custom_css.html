  
  <style>
  /* ── Reset and base typography ─────────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a; background: #fff;
    line-height: 1.6;
  }
  header#title-block-header { display: none; }

  /* ── Default in-flow layout (works in any viewer, any CSS support) ──── */
  body { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
  nav#TOC {
    background: #f7f7fb;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0 2rem 0;
    font-size: 14px;
    line-height: 1.5;
  }
  nav#TOC::before {
    content: "Contents";
    display: block;
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: #555568; margin-bottom: .75rem; font-weight: 700;
  }
  nav#TOC ul { list-style: none; padding-left: 0; margin: 0; }
  nav#TOC ul ul { padding-left: 1.1rem; margin: .15rem 0 .35rem 0; }
  nav#TOC li { margin: .15rem 0; }
  nav#TOC a {
    color: #2840c8; text-decoration: none;
    display: inline-block; padding: 1px 4px; border-radius: 3px;
  }
  nav#TOC a:hover { background: #eef1fb; text-decoration: underline; }

  section.level1 { padding: 0 0 4rem 0; }
  section.level2, section.level3, section.level4 { padding: 0; margin: 0; background: transparent; }

  h1, h2, h3, h4 { color: #14143a; line-height: 1.25; }
  h1 { font-size: 1.85rem; border-bottom: 2px solid #d4d4d8; padding-bottom: .45rem; margin-top: 1.5rem; }
  h2 { font-size: 1.45rem; border-bottom: 1px solid #e4e4e7; padding-bottom: .3rem; margin-top: 2.2rem; }
  h3 { font-size: 1.18rem; margin-top: 1.6rem; color: #2a2a55; }
  h4 { font-size: 1.0rem; margin-top: 1.25rem; color: #444466; }

  p, li { line-height: 1.6; }
  table {
    border-collapse: collapse; width: 100%; margin: .9rem 0; font-size: 14px;
    background: #fff; border: 1px solid #d4d4d8;
  }
  th, td { border: 1px solid #e4e4e7; padding: 7px 11px; text-align: left; vertical-align: top; }
  th { background: #ececf2; font-weight: 600; }
  tr:nth-child(even) td { background: #fafafc; }

  /* ── Code blocks — LIGHT background, DARK text, readable in any viewer ── */
  code {
    background: #f2f2f5;
    border: 1px solid #d4d4d8;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 0.88em;
    color: #993380;
  }
  pre {
    background: #f6f6f9;                         /* LIGHT */
    color: #1a1a1a;                              /* DARK default text */
    border: 1px solid #d4d4d8;
    padding: 0.9rem 1.1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.45;
  }
  pre code {
    background: transparent;
    border: none;
    padding: 0;
    font-size: inherit;
    color: inherit;                              /* inherits dark color from <pre> */
  }
  /* Override any syntax-highlight token colors that would be too light on a light background.
     Pandoc emits tokens like:
       .so (operator), .ot (other), .va (variable), .at (attribute), .er (error)
     Force readable dark colors. */
  pre .so, pre .ot, pre .va, pre .at, pre .er, pre .fu, pre .bu, pre .cn,
  pre .dv, pre .fl, pre .ch, pre .st, pre .vs, pre .ss, pre .sx, pre .vt,
  pre .op, pre .pp, pre .bn { color: #1a1a1a !important; }
  /* Specific tokens that CAN safely be colored (still on light bg) */
  pre .kw, pre .cf { color: #2840c8 !important; font-weight: 600; }   /* keywords (from, import, if) */
  pre .co { color: #6b8060 !important; font-style: italic; }          /* comments */
  pre .st, pre .vs { color: #117755 !important; }                     /* strings */
  pre .dv, pre .fl, pre .bn { color: #aa3322 !important; }            /* numerics */
  pre .im { color: #2840c8 !important; }                              /* imports */

  blockquote {
    border-left: 4px solid #c98a00;
    background: #fff8e6;
    margin: 1rem 0;
    padding: .65rem 1rem;
    color: #4a3500;
    border-radius: 0 4px 4px 0;
  }
  blockquote strong { color: #7a5500; }
  hr { border: none; border-top: 1px solid #d4d4d8; margin: 2rem 0; }
  a { color: #2840c8; }

  /* ── Progressive enhancement: sticky sidebar on wide screens ─────────── */
  @media (min-width: 1100px) {
    @supports (position: sticky) {
      body {
        max-width: none; padding: 0;
        display: grid;
        grid-template-columns: 300px 1fr;
        align-items: start;
      }
      nav#TOC {
        position: sticky; top: 0;
        width: 300px; height: 100vh;
        margin: 0; border: none;
        border-right: 1px solid #d4d4d8;
        border-radius: 0;
        background: #f7f7fb;
        overflow-y: auto;
        padding: 1.25rem 1rem 2rem 1.25rem;
        font-size: 13px;
        z-index: 10;
      }
      section.level1, header#title-block-header {
        grid-column: 2;
        padding: 1.5rem 3rem 4rem 3rem;
        max-width: 1080px;
      }
    }
  }
  </style>
