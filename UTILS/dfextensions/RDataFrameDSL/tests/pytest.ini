[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude exploration directory - explorations have their own runner (run_exploration.sh)
norecursedirs = exploration .* __pycache__ *.egg-info

markers =
    root_serial: Tests that require serial ROOT execution (no pytest-xdist)
    type_a: Type A tests - engine level validation
    type_b: Type B tests - full DSL chain validation
    p0: Priority 0 - blocking issues
    p1: Priority 1 - required before commit
    p2: Priority 2 - suggested improvements
    feature: Feature marker for capability matrix
    unit: Unit tests
    slow: Slow tests
