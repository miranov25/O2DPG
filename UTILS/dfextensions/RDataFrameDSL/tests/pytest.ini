[pytest]
# Phase 13.4.D9: pytest configuration

# Register markers
markers =
    root_serial: Tests requiring ROOT gInterpreter (must run serially)
    requires_root: Tests that require ROOT to be available
    future: Tests for future functionality (may skip)

# Default options (can override on command line)
# By default, exclude ROOT tests - run with: pytest -m "root_serial" -n 0
addopts = -m "not root_serial"

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore obsolete test files
# Add files to ignore here
# ignore = tests/test_carray_dsl_integration.py
